<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAS Runner · 飞书授权回调</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2329; padding: 24px;
  }
  .card {
    width: 100%; max-width: 520px; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(31, 35, 41, .08); padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 14px; line-height: 1.7; color: #646a73; margin: 0 0 16px; }
  .state { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .ok { background: #e8f7ee; color: #1a7f45; }
  .err { background: #fdecec; color: #c02a2a; }
  .code-box {
    margin: 16px 0; padding: 12px 14px; background: #f5f6f8; border: 1px solid #e5e6eb;
    border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; word-break: break-all; line-height: 1.6; max-height: 120px; overflow: auto;
  }
  button {
    width: 100%; padding: 11px; font-size: 14px; font-weight: 500; color: #fff;
    background: #3370ff; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #245bdb; }
  button:disabled { background: #bbbfc4; cursor: default; }
  .hint { font-size: 12px; color: #8f959e; margin-top: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>飞书授权回调</h1>
  <div id="status"><span class="state">处理中…</span></div>
  <p id="msg" style="margin-top:14px">正在把授权结果交还给 MAS Runner，请稍候。</p>

  <div id="fallback" class="hidden">
    <p>自动回传没有成功（浏览器可能拦截了跨窗口通信）。请点下面的按钮复制授权码，回到 Runner 悬浮球粘贴。</p>
    <div class="code-box" id="codeText"></div>
    <button id="copyBtn">复制授权码</button>
  </div>
  <div id="hint" class="hint hidden">这个窗口可以关闭了。</div>
</div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var code = qs.get('code');
  var state = qs.get('state') || '';
  var error = qs.get('error');

  var statusEl = document.getElementById('status');
  var msgEl = document.getElementById('msg');
  var fallbackEl = document.getElementById('fallback');
  var codeEl = document.getElementById('codeText');
  var copyBtn = document.getElementById('copyBtn');
  var hintEl = document.getElementById('hint');

  function badge(text, cls) {
    statusEl.innerHTML = '<span class="state ' + cls + '">' + text + '</span>';
  }

  if (error) {
    badge('授权未完成', 'err');
    msgEl.textContent = error === 'access_denied'
      ? '你在授权页取消了授权。请回到 Runner 重新点击「登录飞书」。'
      : '授权失败：' + error;
    hintEl.textContent = '这个窗口可以关闭了。';
    hintEl.classList.remove('hidden');
    return;
  }

  if (!code) {
    badge('缺少授权码', 'err');
    msgEl.textContent = '地址栏里没有 code 参数。请从 Runner 悬浮球重新发起授权。';
    return;
  }

  var payload = { source: 'mas-runner-oauth', code: code, state: state };
  var delivered = false;

  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(payload, '*');
      delivered = true;
    }
  } catch (e) { /* 跨域限制，走降级 */ }

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(payload, '*');
      delivered = true;
    }
  } catch (e) { /* ignore */ }

  if (delivered) {
    badge('授权成功', 'ok');
    msgEl.textContent = '授权码已交还给 MAS Runner，正在换取登录凭证。可以关闭这个窗口了。';
    hintEl.classList.remove('hidden');
    setTimeout(function () { try { window.close(); } catch (e) {} }, 1200);
  } else {
    badge('需要手动回传', 'err');
    msgEl.textContent = '';
    codeEl.textContent = code;
    fallbackEl.classList.remove('hidden');
  }

  copyBtn.addEventListener('click', function () {
    var done = function () {
      copyBtn.textContent = '已复制，回到 Runner 粘贴';
      copyBtn.disabled = true;
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () { selectFallback(); });
    } else {
      selectFallback();
    }
    function selectFallback() {
      var r = document.createRange();
      r.selectNodeContents(codeEl);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      done();
    }
  });
})();
</script>
</body>
</html>
